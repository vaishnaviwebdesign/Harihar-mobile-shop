<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harihar Mobile Shop | Mobile Sales, Repair & Accessories</title>

<meta name="description" content="Harihar Mobile Shop - Mobile Sales, Repairing, Accessories, Recharge and Tempered Glass.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#080808;
    color:white;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(8,8,8,0.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #333;
}

.navbar{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffd700,#ff9d00);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#111;
    font-size:23px;
    font-weight:bold;
}

.logo-text h2{
    color:#ffd700;
    font-size:20px;
}

.logo-text p{
    color:#aaa;
    font-size:11px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:22px;
    font-size:14px;
    transition:.3s;
}

nav a:hover{
    color:#ffd700;
}

/* HERO */
.hero{
    min-height:90vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 20px;
    background:
    radial-gradient(circle at top,#382b00 0%,transparent 35%),
    linear-gradient(135deg,#050505,#171717,#050505);
}

.hero-content{
    max-width:900px;
}

.badge{
    display:inline-block;
    border:1px solid #ffd700;
    color:#ffd700;
    padding:8px 18px;
    border-radius:30px;
    font-size:13px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(40px,8vw,80px);
    line-height:1;
    margin-bottom:20px;
}

.hero h1 span{
    color:#ffd700;
}

.hero p{
    color:#ccc;
    max-width:650px;
    margin:auto;
    line-height:1.7;
    font-size:16px;
}

.buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 25px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.btn-gold{
    background:#ffd700;
    color:#111;
}

.btn-gold:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(255,215,0,.3);
}

.btn-outline{
    border:1px solid #ffd700;
    color:#ffd700;
}

.btn-outline:hover{
    background:#ffd700;
    color:#111;
}

/* SECTIONS */
section{
    padding:75px 20px;
}

.container{
    max-width:1150px;
    margin:auto;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-size:38px;
}

.section-title h2 span{
    color:#ffd700;
}

.section-title p{
    color:#aaa;
    margin-top:10px;
}

/* SERVICES */
.services{
    background:#0d0d0d;
}

.service-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px;
}

.service-card{
    background:linear-gradient(145deg,#191919,#0c0c0c);
    border:1px solid #292929;
    border-radius:20px;
    padding:30px 15px;
    text-align:center;
    transition:.3s;
}

.service-card:hover{
    transform:translateY(-8px);
    border-color:#ffd700;
    box-shadow:0 10px 35px rgba(255,215,0,.12);
}

.service-icon{
    width:65px;
    height:65px;
    margin:0 auto 18px;
    border-radius:18px;
    background:rgba(255,215,0,.1);
    border:1px solid rgba(255,215,0,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

.service-card h3{
    font-size:17px;
    margin-bottom:8px;
}

.service-card p{
    color:#999;
    font-size:13px;
    line-height:1.5;
}

/* ABOUT */
.about{
    background:#080808;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    align-items:center;
}

.about-box{
    background:linear-gradient(145deg,#191919,#0c0c0c);
    padding:40px;
    border-radius:25px;
    border:1px solid #292929;
}

.about-box h2{
    font-size:35px;
    margin-bottom:18px;
}

.about-box h2 span{
    color:#ffd700;
}

.about-box p{
    color:#bbb;
    line-height:1.8;
}

.features{
    margin-top:25px;
}

.features div{
    margin:12px 0;
    color:#ddd;
}

.features span{
    color:#ffd700;
    margin-right:8px;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:20px;
}

.stat{
    text-align:center;
    padding:25px;
    border:1px solid #292929;
    border-radius:18px;
}

.stat h3{
    color:#ffd700;
    font-size:30px;
}

.stat p{
    color:#999;
    font-size:13px;
}

/* PRODUCTS */
.products{
    background:#0d0d0d;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.product-card{
    background:#151515;
    border:1px solid #292929;
    border-radius:20px;
    overflow:hidden;
    transition:.3s;
}

.product-card:hover{
    transform:translateY(-5px);
    border-color:#ffd700;
}

.product-img{
    height:180px;
    background:
    radial-gradient(circle,#393000,#141414 60%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
}

.product-info{
    padding:20px;
}

.product-info h3{
    margin-bottom:8px;
}

.product-info p{
    color:#999;
    font-size:13px;
    line-height:1.5;
}

/* WHY US */
.why{
    background:#080808;
}

.why-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.why-card{
    padding:30px;
    background:#111;
    border-radius:20px;
    border:1px solid #292929;
}

.why-card .number{
    color:#ffd700;
    font-size:30px;
    font-weight:bold;
}

.why-card h3{
    margin:12px 0;
}

.why-card p{
    color:#999;
    line-height:1.6;
    font-size:14px;
}

/* CONTACT */
.contact{
    background:
    radial-gradient(circle at center,#332700 0%,transparent 45%),
    #0d0d0d;
}

.contact-box{
    max-width:850px;
    margin:auto;
    text-align:center;
    background:rgba(20,20,20,.9);
    border:1px solid #333;
    border-radius:25px;
    padding:45px 25px;
}

.contact-box h2{
    font-size:38px;
    margin-bottom:15px;
}

.contact-box h2 span{
    color:#ffd700;
}

.contact-box p{
    color:#aaa;
    margin-bottom:25px;
}

.contact-info{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.info{
    padding:13px 20px;
    border:1px solid #333;
    border-radius:30px;
    color:#ddd;
}

/* FOOTER */
footer{
    background:#050505;
    border-top:1px solid #222;
    text-align:center;
    padding:30px 20px;
}

footer h3{
    color:#ffd700;
    margin-bottom:8px;
}

footer p{
    color:#777;
    font-size:13px;
}
